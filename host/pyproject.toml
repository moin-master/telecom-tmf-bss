[project]
name = "bss-host"
version = "0.1.0"
description = "Mounts every service on one port under the context path"
requires-python = ">=3.12"
dependencies = ["bss-shared", "product-catalog", "fastapi>=0.115", "uvicorn>=0.30"]

[tool.uv.sources]
bss-shared = { workspace = true }
product-catalog = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"
