[project]
name = "telecom-tmf-bss"
version = "0.1.0"
description = "Telecom BSS proof of concept on TM Forum Open APIs, GraphQL and SQLite"
requires-python = ">=3.12"
dependencies = ["bss-host", "account", "bss-shared", "customer", "identity", "party", "product-catalog", "product-order", "resource-inventory", "service-registry", "shopping-cart"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["host", "shared", "services/*"]

[tool.uv.sources]
bss-host = { workspace = true }
bss-shared = { workspace = true }
account = { workspace = true }
customer = { workspace = true }
identity = { workspace = true }
party = { workspace = true }
product-catalog = { workspace = true }
product-order = { workspace = true }
resource-inventory = { workspace = true }
service-registry = { workspace = true }
shopping-cart = { workspace = true }
