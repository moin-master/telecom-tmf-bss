[project]
name = "account"
version = "0.1.0"
description = "TMF666 Account Management"
requires-python = ">=3.12"
dependencies = [
    "bss-shared",
    "identity",
    "fastapi>=0.115",
    "mongita>=1.2",
    "strawberry-graphql[fastapi]>=0.240",
]

[tool.uv.sources]
bss-shared = { workspace = true }
identity = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"
