[project]
name = "identity"
version = "0.1.0"
description = "Email and password sign-in (project extension, not a TM Forum API)"
requires-python = ">=3.12"
dependencies = [
    "bss-shared",
    "customer",
    "party",
    "fastapi>=0.115",
    "mongita>=1.2",
    "strawberry-graphql[fastapi]>=0.240",
]

[tool.uv.sources]
bss-shared = { workspace = true }
customer = { workspace = true }
party = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"
