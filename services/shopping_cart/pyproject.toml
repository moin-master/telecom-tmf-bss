[project]
name = "shopping-cart"
version = "0.1.0"
description = "TMF663 Shopping Cart"
requires-python = ">=3.12"
dependencies = [
    "bss-shared",
    "product-catalog",
    "resource-inventory",
    "fastapi>=0.115",
    "mongita>=1.2",
    "strawberry-graphql[fastapi]>=0.240",
]

[tool.uv.sources]
bss-shared = { workspace = true }
product-catalog = { workspace = true }
resource-inventory = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"
