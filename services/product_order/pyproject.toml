[project]
name = "product-order"
version = "0.1.0"
description = "TMF622 Product Ordering"
requires-python = ">=3.12"
dependencies = [
    "account",
    "bss-shared",
    "customer",
    "identity",
    "product-catalog",
    "shopping-cart",
    "fastapi>=0.115",
    "mongita>=1.2",
    "strawberry-graphql[fastapi]>=0.240",
    "service-order",
]

[tool.uv.sources]
account = { workspace = true }
bss-shared = { workspace = true }
customer = { workspace = true }
identity = { workspace = true }
product-catalog = { workspace = true }
shopping-cart = { workspace = true }
service-order = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"
