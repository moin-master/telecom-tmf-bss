fragment CartItemFields on CartItem {
  id
  quantity
  purchaseOption
  contractMonths
  launchOffer {
    id
    name
  }
  product {
    productCharacteristic {
      name
      value
    }
    realizingResource {
      id
    }
  }
  productOffering {
    id
    name
  }
  itemPrice {
    name
    priceType
    recurringChargePeriod
    price {
      dutyFreeAmount {
        unit
        value
      }
    }
  }
  itemSubtotal {
    name
    priceType
    recurringChargePeriod
    price {
      taxIncludedAmount {
        unit
        value
      }
    }
  }
  itemTotalPrice {
    name
    priceType
    recurringChargePeriod
    regularPrice {
      unit
      value
    }
    price {
      taxIncludedAmount {
        unit
        value
      }
    }
  }
}

fragment CartFields on ShoppingCart {
  id
  lastUpdate
  cartItem {
    ...CartItemFields
  }
  cartTotalPrice {
    name
    priceType
    recurringChargePeriod
    price {
      taxIncludedAmount {
        unit
        value
      }
    }
  }
}

query QuoteCartItem(
  $productOfferingId: String!
  $quantity: Int!
  $purchaseOption: String
  $contractMonths: Int
  $launchOffer: String
) {
  quoteCartItem(
    productOfferingId: $productOfferingId
    quantity: $quantity
    purchaseOption: $purchaseOption
    contractMonths: $contractMonths
    launchOffer: $launchOffer
  ) {
    ...CartItemFields
  }
}

query Cart($id: String!) {
  shoppingCart(id: $id) {
    ...CartFields
  }
}

mutation CreateCart {
  createShoppingCart {
    ...CartFields
  }
}

mutation AddCartItem(
  $cartId: String!
  $productOfferingId: String!
  $quantity: Int!
  $purchaseOption: String
  $contractMonths: Int
  $launchOffer: String
) {
  addCartItem(
    cartId: $cartId
    productOfferingId: $productOfferingId
    quantity: $quantity
    purchaseOption: $purchaseOption
    contractMonths: $contractMonths
    launchOffer: $launchOffer
  ) {
    ...CartFields
  }
}

mutation UpdateCartItem(
  $cartId: String!
  $cartItemId: String!
  $quantity: Int
  $purchaseOption: String
  $contractMonths: Int
  $launchOffer: String
) {
  updateCartItem(
    cartId: $cartId
    cartItemId: $cartItemId
    quantity: $quantity
    purchaseOption: $purchaseOption
    contractMonths: $contractMonths
    launchOffer: $launchOffer
  ) {
    ...CartFields
  }
}

mutation RemoveCartItem($cartId: String!, $cartItemId: String!) {
  removeCartItem(cartId: $cartId, cartItemId: $cartItemId) {
    ...CartFields
  }
}

mutation ConfigureCartItem($cartId: String!, $cartItemId: String!, $numberResourceId: String!) {
  configureCartItem(cartId: $cartId, cartItemId: $cartItemId, numberResourceId: $numberResourceId) {
    ...CartFields
  }
}
